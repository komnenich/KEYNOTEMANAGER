/* Layout: brand band header + three-pane workspace (divisions · keynote list · editor), full-height app */
:root {
  --font-brand: "Helvetica Neue LT Pro", "HelveticaNeueLTPro", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --bg: #F5F5F4; --surface: #FFFFFF; --surface-2: #F5F5F4; --tint: #F6F2F7; --sel: #EFE9F1;
  --line: #EAEAEA; --line-strong: #C8C8C8;
  --fg: #212121; --fg-2: #424242; --muted: #6B6A69;
  --plum: #4E2751; --plum-dark: #3F1F42; --plum-light: #8B62A9;
  --band: #4E2751; --band-fg: #EAEAEA;
  --gold: #F7CF7A; --on-gold: #212121; --cream: #FAE8C4; --warn-bg: #FEF7E8; --red: #F04A52;
  --chip-ink-bg: #212121; --chip-ink-fg: #EAEAEA; --chip-n-bg: #EAEAEA; --chip-n-fg: #424242;
  --btn-bg: #4E2751; --btn-bg-hover: #3F1F42; --btn-fg: #FFFFFF;
  --mark: #F7CF7A; --scrim: rgba(33,33,33,0.55); --shadow-md: 0 6px 18px rgba(33,33,33,0.12); --shadow-lg: 0 18px 44px rgba(33,33,33,0.18);
}
/* Always light: no dark-mode overrides. */
:root, :root[data-theme], html, body { color-scheme: light !important; }
/* Light scrollbars everywhere */
* { scrollbar-color: #C8C8C8 #F5F5F4; scrollbar-width: thin; }
::-webkit-scrollbar { width: 10px; height: 10px; background: #F5F5F4; }
::-webkit-scrollbar-track { background: #F5F5F4; }
::-webkit-scrollbar-thumb { background: #C8C8C8; border: 2px solid #F5F5F4; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #A8A8A8; }
::-webkit-scrollbar-corner { background: #F5F5F4; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-brand); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
mark { background: var(--mark); color: inherit; padding: 0; }
:focus-visible { outline: 2px solid var(--plum-light); outline-offset: 2px; }
.gut { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 759px) { .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0,1fr); }
.hdr { display: flex; align-items: center; gap: 24px; padding-block: 14px; background: var(--band); color: var(--band-fg); flex-wrap: wrap; }
.hdr .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.hdr .name { font-size: 20px; font-weight: 700; line-height: 25px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hdr .name span { font-size: 13px; font-weight: 400; opacity: .85; }
.pagetabs { display: flex; gap: 20px; align-self: stretch; margin: -14px 0; }
.pagetab { border: 0; background: transparent; padding: 0 2px; font-size: 14px; color: var(--band-fg); cursor: pointer; }
.pagetab:hover { background: rgba(255,255,255,0.08); }
.pagetab.on { font-weight: 700; box-shadow: inset 0 -3px 0 var(--gold); }
.vsep { width: 1px; align-self: stretch; background: rgba(234,234,234,0.3); }
.fileinfo { display: flex; flex-direction: column; gap: 2px; min-width: 200px; flex: 1; }
.fileinfo .fn { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fileinfo .fm { font-size: 12px; opacity: .9; }
.hbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hbtn { display: flex; align-items: center; height: 34px; padding: 0 14px; border: 1px solid rgba(234,234,234,0.6); background: transparent; font-size: 13px; font-weight: 500; color: var(--band-fg); cursor: pointer; white-space: nowrap; }
.hbtn:hover:not(:disabled) { border-color: #FFFFFF; background: rgba(255,255,255,0.08); }
.hbtn:disabled { opacity: .45; cursor: not-allowed; }

.btn { font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 2px; cursor: pointer; white-space: nowrap; font-size: 11px; padding: 8px 14px; min-height: 34px; transition: background-color 120ms, border-color 120ms, color 120ms; }
.btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn-primary:hover:not(:disabled) { background: var(--btn-bg-hover); }
.btn-outline { background: transparent; color: var(--fg); border-color: var(--line-strong); }
.btn-outline:hover:not(:disabled) { border-color: var(--fg); background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--fg); }
.btn-ghost:hover:not(:disabled) { background: var(--line); }
.btn-inverse { background: #FFFFFF; color: #212121; }
.btn-inverse:hover:not(:disabled) { background: #EAEAEA; }
.btn:disabled { background: var(--line-strong); color: var(--muted); border-color: transparent; cursor: not-allowed; }
.mini { border: 1px solid var(--line-strong); background: var(--surface); padding: 5px 10px; font-size: 12px; font-weight: 500; color: var(--fg); cursor: pointer; white-space: nowrap; }
.mini:hover { border-color: var(--fg); }
.link { border: 0; background: transparent; padding: 0; font-size: 12px; color: var(--plum); text-decoration: underline; cursor: pointer; }

.banner { display: flex; align-items: center; gap: 16px; padding-block: 10px; border-bottom: 1px solid var(--line-strong); flex-wrap: wrap; }
.banner > div { flex: 1; min-width: 240px; }

.work { position: relative; display: grid; min-height: 0; }
.side { overflow: auto; background: var(--tint); border-right: 1px solid var(--line); padding: 20px 0; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-2); }
.side .label { padding: 0 20px 10px; }
.divbtn { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; padding: 9px 20px; cursor: pointer; background: transparent; color: var(--fg); }
.divbtn:hover { background: var(--surface-2); }
.divbtn.on { background: var(--sel); box-shadow: inset 4px 0 0 var(--plum); }
.divbtn .k { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.divbtn .t { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.divbtn .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
.toolbar { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 200px; }
.search svg { position: absolute; left: 12px; top: 50%; margin-top: -8px; stroke: var(--fg-2); }
.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 0; font-size: 14px; color: var(--fg); background: var(--surface); }
.search .field { padding-left: 36px; background: var(--tint); }
.field:focus { outline: none; border-color: var(--plum); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--plum-light); }
.tabs { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 6px 0 10px; font-size: 13px; cursor: pointer; color: var(--fg); }
.tab.on { font-weight: 700; box-shadow: inset 0 -2px 0 var(--plum); }
.note { padding-bottom: 10px; font-size: 12px; color: var(--muted); }
.thead { display: grid; gap: 16px; padding-block: 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); }
.sorth { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); cursor: pointer; text-align: left; }
.sorth.on, .sorth:hover { color: var(--fg); }
.sorth span { font-size: 10px; letter-spacing: 0; color: var(--plum); }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.kn { display: grid; gap: 16px; align-items: start; border-bottom: 1px solid var(--surface-2); cursor: pointer; }
.kn:hover { background: var(--surface-2); }
.kn.on { background: var(--sel); box-shadow: inset 4px 0 0 var(--plum); }
.caret { flex: none; width: 20px; height: 20px; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.caret:hover { background: var(--line); }
.caret svg { stroke: var(--fg); transition: transform 140ms; }
.chip { padding: 3px 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.dot { width: 8px; height: 8px; background: var(--red); flex: none; display: inline-block; }
.empty { padding: 64px 24px; text-align: center; color: var(--fg-2); }
.empty b { display: block; font-size: 20px; color: var(--fg); margin-bottom: 6px; }
.cmprow { display: grid; gap: 6px 16px; align-items: start; padding-block: 12px; border-bottom: 1px solid var(--line); }
.cmprow:hover { background: var(--surface-2); }
.intro { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; max-width: 560px; padding-block: 56px; }
.intro h2 { font-size: 20px; line-height: 25px; margin: 0; text-wrap: balance; }
.rule { height: 2px; width: 48px; background: var(--plum); }
.rule.s { width: 32px; }

.aside { overflow: auto; background: var(--surface-2); border-left: 1px solid var(--line); flex-direction: column; top: 0; right: 0; bottom: 0; max-width: 100vw; z-index: 15; }
.panel { display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.closebar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 10px 24px; background: var(--band); color: var(--band-fg); }
.flabel { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.raw { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.tabtok { padding: 1px 5px; background: var(--sel); color: var(--plum); font-size: 10px; font-weight: 700; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); }
.aside .card.alt { background: var(--surface-2); }
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 24px; z-index: 20; }
.dialog { width: 100%; max-height: 85vh; overflow: auto; background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 16px; padding: 28px; }
.pick { text-align: left; padding: 10px 12px; font-size: 13px; cursor: pointer; color: var(--fg); display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line-strong); }
.pick.on { background: var(--sel); border: 2px solid var(--plum); }
.toast { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(420px, calc(100vw - 32px)); padding: 12px 16px; background: #212121; color: #EAEAEA; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 10px; font-size: 13px; }
.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { accent-color: var(--plum); width: 16px; height: 16px; margin: 2px 0 0; flex: none; }
textarea.field { resize: vertical; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ===== Style A: soft modern (rounded shapes, pills, Manrope) ===== */
:root { --font-brand: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; }
body { font-weight: 500; }
.hdr .name { font-weight: 800; letter-spacing: -0.01em; }
.pagetabs { align-self: center; margin: 0; gap: 6px; background: rgba(255,255,255,0.10); padding: 4px; border-radius: 999px; }

.hbtn { border-radius: var(--r-md); }
.btn { border-radius: var(--r-md); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 700; padding: 8px 16px; }
.mini { border-radius: var(--r-sm); font-weight: 600; }
.field { border-radius: var(--r-md); }
.search .field { border-color: transparent; }
.tabs { gap: 6px; padding-bottom: 10px; align-items: center; }
.tab { padding: 6px 14px; border-radius: 999px; font-weight: 600; color: var(--fg-2); }
.tab:hover { background: var(--surface-2); }
.tab.on { background: var(--sel); color: var(--plum); box-shadow: none; font-weight: 700; }
.note { padding-bottom: 0; }
.chip { border-radius: 999px; text-transform: none; letter-spacing: 0.01em; font-size: 11px; padding: 3px 10px; }
.side { padding: 16px 0; }
.divbtn { border-radius: var(--r-md); margin: 2px 10px; width: calc(100% - 20px); padding: 9px 12px; }
.divbtn.on { box-shadow: none; }
.kn.on { box-shadow: inset 4px 0 0 var(--plum); }
.caret { border-radius: 6px; }
.dot { border-radius: 50%; }
.thead { border-bottom: 0; }
.aside { padding: 12px; gap: 12px; }
.aside > .panel, .aside > div:last-child { border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.panel { border-bottom: 0; }
.closebar { border-radius: var(--r-lg); }
.card { border-radius: var(--r-md); }

.dialog { border-radius: 18px; }
.pick { border-radius: var(--r-md); }

.cmprow { border-bottom-color: var(--surface-2); }
.banner { border-bottom: 0; }

:root { --st-red-bg: #FEF4F4; --st-red-hover: #FCEBEC; --st-red-fg: #A3242B; --st-red-chip: #FDE7E8;

.cmprow.st-nospec { background: var(--st-red-bg); }

.cmprow.st-nospec .stkey { color: var(--st-red-fg); }

.cmprow.st-ok .stkey { color: var(--plum); }

    const nCh = changeList.length, linked = s.linked && !!this.handle;
    const conf = s.conflicts || [], t = s.toast, cd = s.confirmDel;
    const sync = s.lastSync && linked ? ' · synced ' + new Date(s.lastSync).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    const W = s.w || 1400, wide = W >= 1200, narrow = W < 760, onSpec = page !== 'keynotes';
    const specSide = onSpec && !!d && !narrow;
    const layoutCols = onSpec ? (specSide ? 'minmax(0,1fr) minmax(300px,380px)' : 'minmax(0,1fr)') : wide ? 'minmax(170px,230px) minmax(0,1fr) minmax(300px,380px)' : narrow ? 'minmax(0,1fr)' : 'minmax(160px,200px) minmax(0,1fr)';
    const asideStatic = (wide && !onSpec) || specSide;
    const showAside = asideStatic || !!d;
    const rowCols = narrow ? 'minmax(90px,130px) minmax(0,1fr)' : 'minmax(110px,180px) minmax(0,1fr) 72px';
    const rowPad = P.density === 'compact' ? '6px' : '11px';
    const S = this.specData(s, items, keys), D = this.drawData(s, items);
    const newKeynote = () => {
      const sel = s.sel && items[s.sel] ? s.sel : null;
      if (sel && items[sel].parent) return this.startNew(items[sel].parent, '', sel);
      this.startNew(sel || s.scope || '');
    };
    const vtab = (id, label) => <button key={id} className={'tab' + (s.view === id && !q ? ' on' : '')} onClick={() => this.setState({ view: id, query: '' })}>{label}</button>;
    const rawText = d ? this.finalText(d.text) || 'TEXT' : '';

    return (
      <div className="app">
        <input type="file" accept=".txt,text/plain" ref={this.fileRef} onChange={this.onFilePicked} style={{ display: 'none' }} />

        <header className="hdr gut">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            <div className="eyebrow">LJC Design &amp; Engineering</div>
            <div className="name">Keynote Manager<span>Updated Oct 28, 2026</span></div>
          </div>
          <nav className="pagetabs">
            {[['keynotes', 'Keynotes'], ['drawings', 'Spec Check']].map(([id, label]) => (
              <button key={id} className={'pagetab' + (page === id ? ' on' : '')} onClick={() => this.setState({ page: id })}>{label}</button>
            ))}
          </nav>
          <div className="vsep"></div>
          <div className="fileinfo">
            <div className="fn">{s.fileName || 'No file'}</div>
            <div className="fm">{keys.length} keynotes · {ENC_LABEL[s.enc] || s.enc} · {linked ? 'Linked, publishes straight to the file' : 'Publish saves an updated copy'}{sync}</div>
          </div>
          <div className="hbtns">
            <button className="hbtn" onClick={this.openFile}>Open file</button>
            {linked && <button className="hbtn" onClick={this.refresh}>Refresh</button>}
            <button className="hbtn" onClick={() => this.setState({ showPrefs: true })} aria-label="Settings">Settings</button>
            <Btn variant="inverse" onClick={this.publish} disabled={linked && nCh === 0 && !s.remoteChanged}>{linked ? (nCh ? 'Publish ' + nCh + ' change' + (nCh === 1 ? '' : 's') : 'Published') : 'Download .txt'}</Btn>
          </div>
        </header>

        <div>
          {!!s.relink && (
            <div className="banner gut" style={{ background: 'var(--sel)' }}>
              <div><strong>Linked to {s.relink}.</strong> Your browser needs one click to allow editing again.</div>
              <Btn onClick={this.reconnect}>Reconnect</Btn>
            </div>
          )}
          {s.remoteChanged && (
            <div className="banner gut" style={{ background: 'var(--warn-bg)', borderBottomColor: 'var(--gold)' }}>
              <div><strong>The file was updated by someone else.</strong> Refresh to pull their changes in. Your unpublished edits are kept.</div>
              <Btn onClick={this.refresh}>Refresh</Btn>
            </div>
          )}
        </div>

        <div className="work" style={{ gridTemplateColumns: layoutCols }}>
          {!narrow && !onSpec && (
            <aside className="side">
              <div className="label">Divisions</div>
              {[{ key: 'All keynotes', text: 'Every division', count: keys.length, active: !s.scope, onClick: () => this.setState({ scope: '' }) }]
                .concat(topRoots.map(k => ({ key: k, text: items[k].text, count: desc[k], active: s.scope === k, onClick: () => this.setState({ scope: k, view: 'all' }) })))
                .map(x => (
                  <button key={x.key} className={'divbtn' + (x.active ? ' on' : '')} onClick={x.onClick}>
                    <span style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}><span className="k">{x.key}</span><span className="t">{x.text}</span></span>
                    <span className="c">{x.count}</span>
                  </button>
                ))}
            </aside>
          )}

          {page === 'keynotes' && (
            <main className="main">
              <div className="toolbar gut">
                <div className="row">
                  {narrow && (
                    <select id="scope" className="field" value={s.scope} onChange={e => this.setState({ scope: e.target.value, view: 'all' })} style={{ maxWidth: 200, width: 'auto' }}>
                      <option value="">All divisions</option>
                      {topRoots.map(k => <option key={k} value={k}>{k + '  ' + items[k].text}</option>)}
                    </select>
                  )}
                  <div className="search">
                    <SearchIcon />
                    <input id="kn-search" ref={this.searchRef} className="field" value={s.query} onChange={e => this.setState({ query: e.target.value })} placeholder="Search keys or keynote text   ( / )" />
                  </div>
                  <Btn variant="outline" onClick={newKeynote}>New keynote</Btn>
                </div>
                <div className="tabs">
                  {vtab('all', 'All')}{vtab('changed', 'Changed · ' + changedKeys.length)}{vtab('issues', 'Issues · ' + issueKeys.length)}
                  <div style={{ flex: 1 }}></div>
                  <div className="note">{q ? list.length + ' match' + (list.length === 1 ? '' : 'es') : (P.sortOnWrite ? 'File is written in key order' : 'File keeps its line order · new lines go next to their siblings')}</div>
                </div>
              </div>
              <div className="thead gut" style={{ gridTemplateColumns: rowCols }}>
                <div>Key</div><div>Keynote text</div>{!narrow && <div style={{ textAlign: 'right' }}>Status</div>}
              </div>
              <div className="scroll" ref={this.listRef}>
                {list.map(([k, dep]) => {
                  const it = items[k], stt = st(k), iss = issue(k), sel = s.sel === k || (d && d.origKey === k);
                  const color = P.colorByLevel === false ? 'var(--fg)' : LVL[Math.min(lvlOf(k), 3)];
                  const weight = !it.parent ? 700 : kids[k] ? 500 : 400;
                  return (
                    <div key={k} data-key={k} className={'kn gut' + (sel ? ' on' : '')} style={{ gridTemplateColumns: rowCols, paddingBlock: rowPad }} onClick={() => this.select(k)}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6, paddingLeft: dep * 22, minWidth: 0 }}>
                        {kids[k] ? (
                          <button className="caret" aria-label="Expand or collapse" onClick={e => { e.stopPropagation(); this.setState(x => ({ collapsed: { ...x.collapsed, [k]: !x.collapsed[k] } })); }}>
                            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" strokeWidth="1.6" style={{ transform: s.collapsed[k] ? 'rotate(-90deg)' : 'none' }}><path d="M2 3.5l3 3 3-3"></path></svg>
                          </button>
                        ) : <span style={{ flex: 'none', width: 20 }}></span>}
                        <span style={{ fontVariantNumeric: 'tabular-nums', fontWeight: weight, color, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}><Hl str={k} q={q} /></span>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                        <span style={{ fontWeight: weight, color, overflowWrap: 'anywhere' }}><Hl str={it.text} q={q} /></span>
                        {!!iss && <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}><span className="dot"></span>{iss}</span>}
                      </div>
                      {!narrow && <div style={{ display: 'flex', justifyContent: 'flex-end' }}>{stt && <Chip bg={stt === 'added' ? 'var(--gold)' : 'var(--sel)'} fg={stt === 'added' ? 'var(--on-gold)' : 'var(--plum)'}>{stt === 'added' ? 'Added' : 'Edited'}</Chip>}</div>}
                    </div>
                  );
                })}
                {!list.length && (
                  <div className="empty">
                    <b>{q ? 'No keynotes match “' + s.query.trim() + '”' : s.view === 'changed' ? 'No unpublished changes' : s.view === 'issues' ? 'No issues found' : 'No keynotes yet'}</b>
                    <div>{q ? 'Try a key number or a shorter word.' : s.view === 'issues' ? 'Every keynote has a valid parent and text.' : 'Open a keynote file to start.'}</div>
                  </div>
                )}
              </div>
            </main>
          )}
          {page === 'drawings' && this.renderDrawPage(D, specSide ? W - 380 : W)}

          {showAside && (
            <aside className="aside" style={{ display: 'flex', position: asideStatic ? 'static' : 'absolute', width: asideStatic ? 'auto' : 380, boxShadow: asideStatic ? 'none' : 'var(--shadow-lg)' }}>
              {d ? (
                <>
                  {(onSpec || !asideStatic) && (
                    <div className="closebar">
                      <span className="eyebrow" style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase' }}>{page === 'drawings' ? 'Editing from Spec Check' : 'Editor'}</span>
                      <button className="btn btn-inverse" onClick={() => this.setState({ draft: null, sel: null })}>Close</button>
                    </div>
                  )}
                  <div className="panel">
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <div className="label">{d.isNew ? (d.parent ? 'New keynote' : 'New category') : 'Edit keynote'}</div>
                      <div className="rule s"></div>
                      <div style={{ fontSize: 20, fontWeight: 700, lineHeight: '25px', overflowWrap: 'anywhere' }}>{d.key.trim() || 'Untitled'}</div>
                    </div>
                    <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      <span className="flabel">Key</span>
                      <input id="draft-key" className="field" style={{ fontVariantNumeric: 'tabular-nums' }} value={d.key} onChange={e => { const v = e.target.value.replace(/[\t\r\n]/g, ''); this.setState(x => ({ draft: { ...x.draft, key: v } })); }} />
                    </label>
                    <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      <span className="flabel">Keynote text</span>
                      <textarea id="draft-text" className="field" rows="4" value={d.text} onChange={e => { const v = e.target.value; this.setState(x => ({ draft: { ...x.draft, text: v } })); }}></textarea>
                      <span style={{ fontSize: 12, color: 'var(--muted)' }}>{P.forceUppercase ? 'Tabs and line breaks are removed. Saved in uppercase.' : 'Tabs and line breaks are removed on save.'}</span>
                    </label>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      <span className="flabel">Parent</span>
                      <ParentPicker value={d.parent} items={items} allowed={parentOpts} colorByLevel={P.colorByLevel !== false} onChange={v => this.setState(x => ({ draft: { ...x.draft, parent: v } }))} />
                    </div>
                    {P.showRawLine !== false && (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                        <span className="flabel">Line written to file</span>
                        <div className="raw">
                          <span>{d.key.trim() || 'KEY'}</span><span className="tabtok">TAB</span><span>{rawText}</span>
                          {!!d.parent && <><span className="tabtok">TAB</span><span>{d.parent}</span></>}
                        </div>
                      </div>
                    )}
                    {!!(err && dirty) && <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}><span className="dot"></span>{err}</div>}
                    <div className="row" style={{ gap: 8 }}>
                      <Btn onClick={this.saveDraft} disabled={!dirty || !!err}>{d.isNew ? 'Add' : 'Save'}</Btn>
                      <Btn variant="ghost" onClick={() => this.setState({ draft: null, sel: null })}>Close</Btn>
                    </div>
                    {!d.isNew && (
                      <>
                        <div className="row" style={{ gap: 8, paddingTop: 12, borderTop: '1px solid var(--line)' }}>
                          <Btn variant="outline" onClick={() => this.startNew(d.origKey)}>Add child</Btn>
                          <Btn variant="outline" onClick={() => this.startNew(items[d.origKey].parent, items[d.origKey].text)}>Duplicate</Btn>
                          <Btn variant="ghost" onClick={this.askDelete}>Delete</Btn>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, paddingTop: 12, borderTop: '1px solid var(--line)' }}>
                          <span className="flabel">Spec sections</span>
                          {!!S.sp && S.rel.map(({ sec, why }) => {
                            const r = S.rows[sec], m = S.META[r.status], ft = r.files.find(x => x.title) || r.files[0], act = S.actFor(r);
                            return (
                              <div key={sec} className="card alt">
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                                  <strong style={{ fontVariantNumeric: 'tabular-nums' }}>{sec}</strong>
                                  <span style={{ fontSize: 12, color: 'var(--fg-2)', flex: 1 }}>{why}</span>
                                  <Chip bg={m[1]} fg={m[2]}>{m[0]}</Chip>
                                </div>
                                <div style={{ fontWeight: 500, color: ft ? 'var(--fg)' : 'var(--muted)', overflowWrap: 'anywhere' }}>{ft ? ft.title || ft.name : 'No spec file found'}</div>
                                {r.files.length > 0 && <div style={{ fontSize: 12, color: 'var(--fg-2)', overflowWrap: 'anywhere' }}>{r.files.map(x => x.path).join(' · ')}</div>}
                                <div className="row" style={{ gap: 12 }}>
                                  {act && <button className="mini" onClick={act[1]}>{act[0]}</button>}
                                </div>
                              </div>
                            );
                          })}
                          {!!S.sp && !S.rel.length && <div style={{ fontSize: 13, color: 'var(--fg-2)' }}>No spec section is tied to this keynote.</div>}
                          {!S.sp && (
                            <div className="row" style={{ fontSize: 13, color: 'var(--fg-2)' }}>
                              <span style={{ flex: 1, minWidth: 160 }}>Choose the spec folder to compare this keynote.</span>
                              <button className="mini" onClick={this.chooseSpecFolder}>Choose folder</button>
                            </div>
                          )}
                        </div>
                      </>
                    )}
                  </div>
                </>
              ) : (
                <div className="panel" style={{ gap: 8 }}>
                  <div className="label">Editor</div>
                  <div className="rule s"></div>
                  <div style={{ color: 'var(--fg-2)' }}>Select a keynote to edit it, or add a new one. Changes stay on your screen until you publish.</div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'auto 1fr', gap: '4px 12px', marginTop: 8, fontSize: 12, color: 'var(--fg-2)' }}>
                    <strong style={{ color: 'var(--fg)' }}>/</strong><span>Search</span>
                    <strong style={{ color: 'var(--fg)' }}>Ctrl S</strong><span>Save keynote</span>
                    <strong style={{ color: 'var(--fg)' }}>Esc</strong><span>Close editor</span>
                  </div>
                </div>
              )}

              <div style={{ display: 'flex', flexDirection: 'column', gap: 12, padding: 24 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <div className="label" style={{ flex: 1 }}>Unpublished changes · {nCh}</div>
                  {nCh > 0 && <button className="link" onClick={() => this.setState(x => ({ items: clone(x.base), draft: null, sel: null }))}>Revert all</button>}
                </div>
                {changeList.map(k => {
                  const m = items[k], b = base[k], kind = !b ? 'Added' : !m ? 'Removed' : 'Edited';
                  const summary = kind === 'Removed' ? b.text : kind === 'Added' ? m.text : (b.text !== m.text ? b.text + '  →  ' + m.text : 'Moved under ' + (m.parent || 'top level'));
                  const c = kind === 'Added' ? C.gold : kind === 'Removed' ? C.ink : C.plum;
                  return (
                    <div key={k} className="card" style={{ gap: 4 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <Chip bg={c[0]} fg={c[1]}>{kind}</Chip>
                        <button onClick={() => { if (items[k]) this.reveal(k); }} style={{ flex: 1, textAlign: 'left', border: 0, background: 'transparent', padding: 0, fontWeight: 700, fontVariantNumeric: 'tabular-nums', cursor: 'pointer' }}>{k}</button>
                        <button className="link" onClick={() => this.revert(k)}>Revert</button>
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--fg-2)', overflowWrap: 'anywhere' }}>{summary}</div>
                    </div>
                  );
                })}
                {!nCh && <div style={{ fontSize: 13, color: 'var(--fg-2)' }}>Nothing waiting. Your view matches the file as of the last open or download.</div>}
                <div style={{ marginTop: 8, paddingTop: 12, borderTop: '1px solid var(--line-strong)', fontSize: 12, color: 'var(--fg-2)' }}>
                  {linked ? 'Publishing re-reads the file, merges in anyone else’s edits, then writes. Only the lines you changed are touched.' : 'Download .txt saves the updated keynote file in its original encoding and line order. Save it over the shared file Revit points to. Your edits stay in this browser until you open another file.'}
                </div>
              </div>
            </aside>
          )}
        </div>

        {conf.length > 0 && (
          <div className="overlay">
            <div className="dialog" style={{ maxWidth: 640 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div className="label">Merge</div><div className="rule s"></div>
                <div style={{ fontSize: 20, fontWeight: 700, lineHeight: '25px' }}>{conf.length} keynote{conf.length === 1 ? '' : 's'} changed by both of you</div>
                <div style={{ color: 'var(--fg-2)' }}>Someone else changed these keynotes since you last refreshed. Choose which version to keep for each.</div>
              </div>
              {conf.map((c, i) => {
                const pick = v => () => this.setState(x => ({ conflicts: x.conflicts.map((y, j) => j === i ? { ...y, pick: v } : y) }));
                const on = c.pick === 'mine';
                return (
                  <div key={c.key} style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 12, borderTop: '1px solid var(--line)' }}>
                    <div style={{ fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{c.key}</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                      <button className={'pick' + (on ? ' on' : '')} onClick={pick('mine')}><span className="flabel" style={{ fontSize: 10 }}>Yours</span><span>{fmtVal(c.mine)}</span></button>
                      <button className={'pick' + (!on ? ' on' : '')} onClick={pick('theirs')}><span className="flabel" style={{ fontSize: 10 }}>In the file</span><span>{fmtVal(c.theirs)}</span></button>
                    </div>
                  </div>
                );
              })}
              <div className="row" style={{ gap: 8, justifyContent: 'flex-end' }}>
                <Btn variant="ghost" onClick={this.cancelMerge}>Cancel</Btn>
                <Btn onClick={this.resolveConflicts}>Apply choices</Btn>
              </div>
            </div>
          </div>
        )}

        {!!cd && (
          <div className="overlay" onClick={e => { if (e.target === e.currentTarget) this.setState({ confirmDel: null }); }}>
            <div className="dialog" style={{ maxWidth: 480 }}>
              <div style={{ fontSize: 20, fontWeight: 700, lineHeight: '25px' }}>Delete {cd.key}?</div>
              <div style={{ color: 'var(--fg-2)' }}>It has {cd.count} keynote{cd.count === 1 ? '' : 's'} beneath it. Delete them too, or keep them and move them up one level?</div>
              <div className="row" style={{ gap: 8, justifyContent: 'flex-end' }}>
                <Btn variant="ghost" onClick={() => this.setState({ confirmDel: null })}>Cancel</Btn>
                <Btn variant="outline" onClick={() => this.doDelete(cd.key, false)}>Delete, keep children</Btn>
                <Btn onClick={() => this.doDelete(cd.key, true)}>Delete all</Btn>
              </div>
            </div>
          </div>
        )}

        {s.exportText != null && (
          <div className="overlay" onClick={e => { if (e.target === e.currentTarget) this.setState({ exportText: null }); }}>
            <div className="dialog" style={{ maxWidth: 720 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div className="label">Export</div><div className="rule s"></div>
                <div style={{ fontSize: 20, fontWeight: 700, lineHeight: '25px' }}>Copy the keynote file</div>
                <div style={{ color: 'var(--fg-2)' }}>Downloads aren't available in this view. Copy the text below, paste it into {s.fileName || 'the keynote file'} in Notepad, and save it with the {ENC_LABEL[s.enc] || s.enc} encoding.</div>
              </div>
              <textarea id="export-text" className="field" readOnly rows="14" value={s.exportText} style={{ fontFamily: 'var(--font-mono)', fontSize: 12, whiteSpace: 'pre', overflow: 'auto' }}></textarea>
              <div className="row" style={{ gap: 8, justifyContent: 'flex-end' }}>
                <Btn variant="ghost" onClick={() => this.setState({ exportText: null })}>Close</Btn>
                <Btn variant="outline" onClick={this.markExported}>Mark as published</Btn>
                <Btn onClick={this.copyExport}>Copy text</Btn>
              </div>
            </div>
          </div>
        )}

        {s.showPrefs && (
          <div className="overlay" onClick={e => { if (e.target === e.currentTarget) this.setState({ showPrefs: false }); }}>
            <div className="dialog" style={{ maxWidth: 440 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div className="label">Settings</div><div className="rule s"></div>
                <div style={{ fontSize: 20, fontWeight: 700, lineHeight: '25px' }}>Display and file options</div>
              </div>
              <label className="toggle"><input id="p-compact" type="checkbox" checked={P.density === 'compact'} onChange={e => this.setPref('density', e.target.checked ? 'compact' : 'comfortable')} /><span>Compact rows</span></label>
              <label className="toggle"><input id="p-color" type="checkbox" checked={P.colorByLevel !== false} onChange={e => this.setPref('colorByLevel', e.target.checked)} /><span>Color keynotes by level</span></label>
              <label className="toggle"><input id="p-raw" type="checkbox" checked={P.showRawLine !== false} onChange={e => this.setPref('showRawLine', e.target.checked)} /><span>Show the line written to file in the editor</span></label>
              <label className="toggle"><input id="p-upper" type="checkbox" checked={!!P.forceUppercase} onChange={e => this.setPref('forceUppercase', e.target.checked)} /><span>Save keynote text in uppercase</span></label>
              <label className="toggle"><input id="p-sort" type="checkbox" checked={!!P.sortOnWrite} onChange={e => this.setPref('sortOnWrite', e.target.checked)} /><span>Write the file in key order<br /><span style={{ fontSize: 12, color: 'var(--muted)' }}>Off keeps the file's existing line order and adds new lines next to their siblings.</span></span></label>
              <div className="row" style={{ justifyContent: 'flex-end' }}><Btn onClick={() => this.setState({ showPrefs: false })}>Done</Btn></div>
            </div>
          </div>
        )}

        {t && (
          <div className="toast"><span style={{ width: 8, height: 8, flex: 'none', background: t.tone === 'error' ? 'var(--red)' : t.tone === 'warn' ? '#F7CF7A' : '#8B62A9' }}></span>{t.msg}</div>
        )}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
